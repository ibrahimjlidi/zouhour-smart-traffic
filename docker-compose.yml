version: '3.8'
services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./Smart
    restart: unless-stopped
    env_file:
      - ./Smart/.env
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    networks:
      - smart_net

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - smart_net

volumes:
  mongo_data:

networks:
  smart_net:
    driver: bridge
